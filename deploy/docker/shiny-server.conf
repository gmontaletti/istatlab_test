# Shiny Server Configuration for ISTAT Dashboard
# Documentation: https://docs.posit.co/shiny-server/

run_as shiny;

preserve_logs true;

server {
  listen 3838;

  location /istat-dashboard {
    site_dir /srv/shiny-server/istat-dashboard;
    log_dir /var/log/shiny-server;
    directory_index on;
  }

  location / {
    redirect "/istat-dashboard/";
  }
}

app_init_timeout 120;
app_idle_timeout 300;
