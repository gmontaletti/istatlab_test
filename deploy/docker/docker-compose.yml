# ISTAT Dashboard Docker Compose Configuration
# Usage: docker-compose up -d

services:
  istat-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: istat-dashboard:latest
    container_name: istat-dashboard
    ports:
      - "3838:3838"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G
    environment:
      - SHINY_LOG_LEVEL=INFO
    # Optional: mount data directory for updates without rebuild
    # volumes:
    #   - ./app/data:/srv/shiny-server/istat-dashboard/data:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "-m", "5", "http://localhost:3838/istat-dashboard/"]
      interval: 60s
      timeout: 15s
      retries: 5
      start_period: 120s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
